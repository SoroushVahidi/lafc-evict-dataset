  - family: cloudphysics
    source_name: Alibaba Cloud Elastic Block Storage (EBS) production block trace
    source_url: https://github.com/alibaba/block-traces
    upstream_license: CC BY 4.0
    redistribution_status: cleared
    publication_clearance: cleared_for_public_release
    recommended_for_v0_1_open: true
    privacy_risk: low
    historical_key_note: >-
      IMPORTANT: `cloudphysics` is a historical/internal family key retained
      for reproducibility (it appears throughout committed manifests,
      analysis directories, figures, tables, and experiment outputs, and is
      never renamed retroactively). It does NOT identify the VMware/
      CloudPhysics trace. Per docs/V0_3_V1_DATA_INVENTORY.md, the actual
      local trace behind this key is `cloudphysics_alibaba_block_head_50k`
      -- genuine Alibaba Cloud EBS block-storage trace data, confirmed by an
      explicit recorded checksum
      (`expected_sha256=fedb3d31ee3c1dd847d25f967392cdf0fdec1e9c1fbb6808772e281bc8d4fb57`
      in analysis/closed_loop_production_tier1_20260913/scripts/tier1_core.py)
      and consistent naming across every analysis directory that uses this
      family. No VMware/CloudPhysics-specific data, claim, or characteristic
      appears anywhere in this repository or the manuscript.
    notes: >-
      Reviewed 2026-09-15. Primary source is Alibaba's own GitHub
      repository (github.com/alibaba/block-traces), which states directly:
      "The trace data and document are licensed under CC-4.0" (Creative
      Commons Attribution 4.0 International), linking to the standard CC BY
      4.0 legal text. This is a direct primary-source statement, not a
      third-party redistributor's claim. Associated publication: the
      IISWC 2020 paper on Alibaba Cloud block storage workloads referenced
      from that repository. cacheMon/cache_dataset separately mirrors a
      distinct, differently-attributed "CloudPhysics" trace (VMware
      vscsiStats, Waldspurger et al. FAST'15) that is NOT the data used by
      this project; that mirror is unrelated to this family and must not be
      cited as this family's source. See dataset_card/LICENSE_DATA.md and
      THIRD_PARTY_DATA.md for the required attribution text and the
      historical-naming disclosure. Provenance confidence: STRONG (the
      local trace name and a recorded checksum tie this family
      unambiguously to the Alibaba release; no independently recorded
      checksum against the specific upstream GitHub/S3 artifact itself).
    required_citation: true
    review_status: reviewed_2026_09_15
    recommended_for_v0_2_preview: false
    v0_2_preview_redistribution_status: UNCLEAR

