# `redistribution_status` preserves historical governance vocabulary.
# `publication_clearance` is the explicit public-release gate: only
# `cleared_for_public_release` may be included in a public release.

families:
  - family: twemcache
    source_name: Twitter production cache traces (Twemcache open trace collection)
    source_url: https://github.com/twitter/cache-trace
    upstream_license: CC BY 4.0
    redistribution_status: cleared
    publication_clearance: cleared_for_public_release
    recommended_for_v0_1_open: true
    privacy_risk: low
    notes: >-
      Reviewed 2026-09-15. Primary source (github.com/twitter/cache-trace,
      description "A collection of Twitter's anonymized production cache
      traces") is licensed CC BY 4.0, confirmed both via GitHub's
      license-detection API (spdx_id CC-BY-4.0) and the repository's own
      LICENSE file text (full CC BY 4.0 Public License). CC BY 4.0 permits
      reproduction and Adapted Material with attribution; our tracked
      candidate-level and decision-level derived rows are covered. See
      dataset_card/LICENSE_DATA.md and THIRD_PARTY_DATA.md for the required
      attribution text. Provenance confidence: STRONG (family/source/format
      all match; no independently recorded checksum ties our local copy to a
      specific upstream commit, so this is not verified at the byte level).
      Associated publication already cited in the manuscript bibliography:
      Yang, Yue, and Rashmi, "A Large-Scale Analysis of Hundreds of
      In-Memory Cache Clusters at Twitter," OSDI 2020 (`yang2020twemcache`).
    required_citation: true
    review_status: reviewed_2026_09_15
    recommended_for_v0_2_preview: false
    v0_2_preview_redistribution_status: UNCLEAR

  - family: metakv
    source_name: Meta MetaKV production key-value cache trace (via CacheLib)
    source_url: https://cachelib.org/docs/Cache_Library_User_Guides/Cachebench_FB_HW_eval/
    upstream_license: Apache License 2.0
    redistribution_status: cleared
    publication_clearance: cleared_for_public_release
    recommended_for_v0_1_open: true
    privacy_risk: low
    notes: >-
      Reviewed 2026-09-15. Primary source is Meta's own CacheLib
      documentation, which states verbatim: "These traces are licensed
      under the same license as CacheLib." facebook/CacheLib is confirmed
      Apache License 2.0 via GitHub's license API. Apache-2.0 permits
      reproduction, distribution, and derivative works with attribution and
      notice preservation; our tracked derived rows are covered.
      `https://github.com/cacheMon/cache_dataset` (this entry's
      previously-recorded source_url) is a third-party mirror/redistributor
      that separately asserts a blanket CC BY 4.0 license over its entire
      collection -- this conflicts with CacheLib's own stated Apache-2.0
      basis for this specific trace. The primary source (Meta/CacheLib)
      governs; cacheMon is documented here only as a known secondary mirror
      path, not the license basis. See dataset_card/LICENSE_DATA.md and
      THIRD_PARTY_DATA.md for the required attribution/notice text.
      Provenance confidence: STRONG (family/source/format match; no
      independently recorded checksum against a specific upstream release).
    required_citation: true
    review_status: reviewed_2026_09_15
    recommended_for_v0_2_preview: false
    v0_2_preview_redistribution_status: UNCLEAR

